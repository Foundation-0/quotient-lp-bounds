name: Verify Quotient-LP Certificates

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check recorded SHA-256 hashes
        run: sha256sum -c SHA256SUMS
      - name: Rebuild and compare exact rational certificates
        run: python3 -O -B verify.py
      - name: Verify with zero-import independent checker
        run: python3 -O -B verify_independent.py
      - name: Run unit and adversarial must_fail controls
        run: python3 -O -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Require clean working tree
        run: git diff --exit-code
